<div class="card mb-7 h-100">
  <div class="card-body d-flex flex-column">
    <div class="d-flex align-items-center gap-3 mb-3">
        <img [src]="myUser().image" [alt]="myUser().first_name" class="rounded-circle flex-shrink-0" width="60" height="60">
        <div class="flex-grow-1" style="min-width: 0;">
            <h5 class="mb-1 text-truncate">{{ myUser().first_name }} {{ myUser().last_name }}</h5>
            <p class="card-text text-muted fs-6 mb-0 text-break">{{ myUser().email }}</p>
        </div>
    </div>
    <div class="d-flex gap-2 flex-wrap mt-auto">
      <a [routerLink]="['/user', myUser()._id]" class="btn btn-primary btn-sm">Ver detalle</a>
      <a [routerLink]="['/updateuser', myUser()._id]" class="btn btn-warning btn-sm">Actualizar</a>
      <button class="btn btn-danger btn-sm" (click)="onDelete(myUser()._id)">Borrar</button>
    </div>
  </div>
</div>
