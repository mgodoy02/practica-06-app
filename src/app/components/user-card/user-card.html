<div class="card mb-4">
  <div class="card-body d-md-flex d-block align-items-center">
    <img [src]="myUser().image" [alt]="myUser().first_name" class="rounded-circle me-3" width="60" height="60">
    <div>
      <h5>{{ myUser().first_name }} {{ myUser().last_name }}</h5>
      <p class="card-text text-muted fs-6">{{ myUser().email }}</p>
    </div>
    <div class="d-flex gap-md-2 ms-auto">
      <a [routerLink]="['/user', myUser()._id]" class="btn btn-primary d-flex align-items-center">Ver detalle</a>
      <a [routerLink]="['/updateuser', myUser()._id]" class="btn btn-warning d-flex align-items-center">Actualizar</a>
      <button class="btn btn-danger d-flex align-items-center" (click)="onDelete(myUser()._id)">Borrar</button>
    </div>
  </div>
</div>
