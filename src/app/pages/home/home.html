<section class="container-fluid mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Listado de usuarios</h1>
    <a [routerLink]="['/newuser']" class="btn btn-success">Nuevo usuario</a>
  </div>
  <hr>

  @if (cargando()) {
    <p>Cargando usuarios...</p>
  } @else if (error()) {
    <p class="text-danger">No se ha podido cargar el listado de usuarios.</p>
  } @else if (usersList().length === 0) {
    <p>No hay usuarios para mostrar.</p>
  } @else {
    <div class="row gy-4">
      @for (user of usersList(); track user._id) {
        <div class="col-12 col-md-6 col-lg-4">
          <app-user-card [myUser]="user" (deleted)="onUserDeleted($event)"></app-user-card>
        </div>
      }
    </div>
  }
</section>
