<section class="container mt-4">
  @if (cargando()) {
    <p>Cargando...</p>
  } @else if (!user()) {
    <p class="text-danger">No se ha encontrado el usuario.</p>
  } @else {
    <article class="card shadow-sm">
      <div class="card-body d-flex flex-column flex-md-row gap-4">
        <img [src]="user()!.image" [alt]="user()!.first_name" class="rounded-circle" width="120" height="120">
        <div class="flex-grow-1">
          <h3>{{ user()!.first_name }} {{ user()!.last_name }}</h3>
          <ul class="list-group list-group-flush mb-3">
            <li class="list-group-item">Usuario: {{ user()!.username }}</li>
            <li class="list-group-item">Email: {{ user()!.email }}</li>
          </ul>
          <div class="d-flex gap-2 flex-wrap">
            <a [routerLink]="['/updateuser', user()!._id]" class="btn btn-warning">Actualizar</a>
            <button class="btn btn-danger" (click)="onDelete()">Eliminar</button>
            <a [routerLink]="['/home']" class="btn btn-secondary">Volver al listado</a>
          </div>
        </div>
      </div>
    </article>
  }
</section>
